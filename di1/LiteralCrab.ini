; LiteralCrab DI1: display patches and a script mod loader. Requires a 32-bit ASI loader.
[Display]
; borderless, windowed, or fullscreen. Restart the game to enter exclusive fullscreen.
Mode=borderless
; Unlock driver modes (480..32767 per side), including portrait and multi-monitor ratios.
UnlockResolutions=1
; Preserve the native 16:9 view; ultrawide gains horizontal view, narrow screens gain vertical view.
FixFOV=1
; Stay visible when Alt+Tab, ShareX or the snipping overlay takes focus. Native pause is preserved.
KeepVisibleOnFocusLoss=1
; Allow Windows-key capture shortcuts; keyboard polling and game bindings stay native.
ScreenshotHotkeys=1
; Centre full-screen Scaleform menus/HUD in a 16:9 area on other aspect ratios.
FixUIAspect=1
; Correct game mouse coordinates when the render buffer is scaled into a smaller window.
ScaleMouse=1
; Alt+Enter toggles borderless/windowed. Native fullscreen keeps the game's own hotkey handling.
AltEnter=1
; Write Alt+Enter changes into this INI.
RememberMode=1
; 0 = uncapped, or 15..1000 FPS. Examples: 60, 90, 120, 144, 165, 240, 360.
FrameLimit=120
; auto matches CrabeLoader: bypass VSync when uncapped or the cap >= monitor refresh.
; off permits rates above monitor refresh; on always synchronizes to the display.
VSync=auto
; 1 = write frame-time statistics and mouse/focus state to LiteralCrab.log on each Alt+Tab
; and on exit. For troubleshooting only; leave 0 for normal play.
Diagnostics=0

[Mods]
; Load script and asset mods from mods\<name>\ beside this INI. Without mods nothing is hooked.
Enabled=1
; 1 = log the name of every Lua chunk the game compiles, for mod authors. Leave 0 for play.
Trace=0
