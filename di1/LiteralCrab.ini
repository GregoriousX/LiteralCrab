; LiteralCrab for Disney Infinity 1.0 Gold Edition. Requires a 32-bit ASI loader.
; Restart the game after changing anything here. 1 = on, 0 = off unless stated otherwise.
; Every option left at its default keeps the game's own behavior and installs no hook for it.

[Display]
; --- Window ---
; borderless, windowed or fullscreen. Exclusive fullscreen needs a restart.
Mode=borderless
; Alt+Enter toggles borderless/windowed (native fullscreen keeps the game's own hotkey).
AltEnter=1
; Save Alt+Enter changes into this file.
RememberMode=1
; Keep the picture visible when Alt+Tab, ShareX or the snipping tool takes focus. The game still pauses.
KeepVisibleOnFocusLoss=1

; --- Resolution and aspect ratio ---
; Offer every resolution the driver supports (480..32767 per side), including portrait and multi-monitor.
UnlockResolutions=1
; Keep the 16:9 view: ultrawide screens see more to the sides, narrow screens more above and below.
FixFOV=1
; Keep full-screen menus and the HUD in a centred 16:9 area on other aspect ratios.
FixUIAspect=1

; --- Frame rate ---
; 0 = uncapped, or 15..1000 FPS (e.g. 60, 120, 144, 165, 240).
FrameLimit=120
; auto: no VSync when uncapped or when the cap reaches the monitor's refresh rate.
; off: allow rates above the refresh rate. on: always synchronize to the display.
VSync=auto

; --- Mouse and keyboard ---
; Correct mouse coordinates when the picture is scaled into a smaller window.
ScaleMouse=1
; Allow Windows-key capture shortcuts (Win+Shift+S etc.). Game bindings are unchanged.
ScreenshotHotkeys=1

; --- Troubleshooting ---
; Write frame-time statistics and mouse/focus state to LiteralCrab.log on each Alt+Tab and on exit.
Diagnostics=0

[Startup]
; 1 = start without the logo movies. The movie files are left untouched.
SkipIntro=0

[PostProcessing]
; 0 switches an effect off in every world; 1 keeps the game's own settings.
; Motion blur: smears the picture when the camera turns quickly.
MotionBlur=1
; Depth of field: blurs distant scenery in some worlds and Toy Box skies.
DepthOfField=1
; Bloom: glow around bright lights, sky and shiny surfaces.
Bloom=1

[Camera]
; Seconds the camera waits after you turn it before it swings back behind the character.
; default = each camera's own timing, 0 = returns at once, e.g. 5 = waits five seconds.
ReturnDelay=default

[Controller]
; 1 = exchange the X and Y buttons of Xbox-compatible controllers. On-screen prompts keep the original letters.
SwapXY=0

[ToyBox]
; Works only with [Mods] Enabled=1 (below).
; Multiplies the Toy Box editor's limits (its "memory" meter): object costs, measured memory and
; frame time. 1 = the game's limits, 2..100 = more room. 4 is generous, 10 very high.
; Very large Toy Boxes can still slow down or run out of memory.
LimitScale=1

[Gameplay]
; Works only with [Mods] Enabled=1 (below).
; 1 = play any character in any play set (based on InfinityUnlocked by Philip Parkinson II).
; Visitors use their Toy Box actor; native membership, unlocks and Cars race rules are preserved.
; Player tool selection and unlocked, unsuppressed tools can cross playset zone filters.
; Loads all avatar dependency maps and enables tool/motion effects in play sets, in memory.
CharactersInAnyPlayset=0
; Diagnostic only: records bounded avatar/FX and native EXP events without changing rewards.
TraceCharacterFreedom=0
; Temporary tests only, with CharactersInAnyPlayset=1: multiply positive EXP awards (1..100).
; 1 = normal rewards. Boosted progress is saved by the game; restart after changing this.
TestExperienceMultiplier=1

[ToyBoxes]
; 1 = restore Toy Box Share (Toy Box menu > Toy Box Share) with the Toy Boxes from the toyboxes
; folder beside this file. Drop ZIP packages there under any names and in any subfolders: one or
; many Toy Boxes each, Toy Box Share files (U, UH, UC) or Toy Box saves (SRR, SHRR, SCRR), from
; the PC, PS3 or Wii U. Loose save files work too (each folder counts as one package), but ZIPs
; keep different Toy Boxes' files from clashing. They are listed under "My Toy Boxes" and played from there; nothing is
; copied into your saves. Damaged files are skipped and listed in LiteralCrab.log.
; The menu entry needs [Mods] Enabled=1 (below).
Enabled=0
; EXPERIMENTAL: reading Toy Boxes from servers has not been tested at a large scale yet; enable
; it at your own risk.
; Optional web servers to mirror Toy Box packages from, separated by spaces: folder URLs such as
; https://example.org/toyboxes/ or localhost:8000 (http:// when no scheme is given). Each lists its
; packages in index.txt (one relative path per line, any subfolders) or in a plain directory
; listing. Their Toy Boxes are listed under "Disney's Toy Boxes". Downloaded in the background:
; the game waits up to 5 seconds for them at startup; later ones appear after a save or restart.
Servers=
; Safety limits. Most Toy Boxes listed (1..20000); largest package a server may send, in MB
; (1..1024; a hundred Toy Boxes take about 5 MB); most disk space for all servers' packages, in MB.
; Larger or extra packages are refused and logged.
MaxToyBoxes=5000
ServerMaxPackageMB=32
ServerMirrorMB=1024

[Mods]
; Load script and asset mods from the mods folder beside this file. Without mods nothing is hooked.
; Also required by [ToyBox] LimitScale, [Gameplay] CharactersInAnyPlayset and the [ToyBoxes] menu entry.
Enabled=1
; Log every Lua chunk the game compiles and every file it loads. For mod authors; leave 0 for play.
Trace=0
