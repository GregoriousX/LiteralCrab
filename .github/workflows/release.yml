name: Release - Build & Publish

# VERSION reaching main prepares an unpublished draft/pre-release.
# Published versions (both legacy bare tags and v-prefixed tags) are frozen.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Decide whether to release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Read VERSION and look for an existing release
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::notice::Releases are only prepared from main."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VER=$(tr -d '[:space:]' < VERSION)
          if [[ ! "${VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must look like 1.2.3, found '${VER}'."
            exit 1
          fi
          TAG="v${VER}"
          LIST=$(mktemp)
          STATUS=$(curl -sS -o "${LIST}" -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100")
          if [[ "${STATUS}" != "200" ]]; then
            echo "::error::Could not list existing releases (HTTP ${STATUS})."
            exit 1
          fi
          PUBLISHED=$(python3 -c 'import json,sys; r=json.load(open(sys.argv[1],encoding="utf-8")); print(any(x["tag_name"] in (sys.argv[2],sys.argv[3]) and not x["draft"] for x in r))' "${LIST}" "${TAG}" "${VER}")
          if [[ "${PUBLISHED}" == "True" ]]; then
            echo "::notice::Version ${VER} is already published; leaving its release, tags and assets untouched."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Preparing the LiteralCrab ${VER} draft (tag ${TAG})."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build-and-release:
    name: Build & Release LiteralCrab
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows x86 ASI
        run: cmake -S . -B build-di1 -G "Visual Studio 17 2022" -A Win32
      - name: Build LiteralCrab and DI1 tests
        run: cmake --build build-di1 --config Release --parallel
      - name: Run DI1 tests
        run: ctest --test-dir build-di1 -C Release --output-on-failure
      - name: Package DI1
        shell: pwsh
        run: .\di1\package.ps1 -SourceRevision '${{ github.sha }}'
      - name: Prepare GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: LiteralCrab ${{ needs.plan.outputs.tag }}
          draft: true
          prerelease: true
          generate_release_notes: true
          body: |
            **Draft, visible to maintainers only.** Test the DI1 ASI before publishing.

            The user ZIP contains only LiteralCrab.asi, LiteralCrab.ini and the unchanged README.md.
            LICENSE and NOTICE.txt accompany the download separately.
            Corresponding source for this build: https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip
          files: |
            dist-di1/LiteralCrab-DI1-${{ needs.plan.outputs.version }}-x86.zip
            dist-di1/LICENSE
            dist-di1/NOTICE.txt
            dist-di1/SOURCE.txt
          fail_on_unmatched_files: true
