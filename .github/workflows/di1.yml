name: DI1 ASI - Build and test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x86:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows x86 ASI
        run: cmake -S . -B build-di1 -G "Visual Studio 17 2022" -A Win32
      - name: Build
        run: cmake --build build-di1 --config Release --parallel
      - name: Policy and frame pacing tests
        run: ctest --test-dir build-di1 -C Release --output-on-failure
      - name: Prepare ASI package
        shell: pwsh
        run: .\di1\package.ps1 -SourceRevision '${{ github.sha }}'
      - uses: actions/upload-artifact@v4
        with:
          name: LiteralCrab-x86-ASI
          path: dist-di1/LiteralCrab-DI1-*-x86.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: LiteralCrab-distribution-notices
          path: |
            dist-di1/LICENSE
            dist-di1/NOTICE.txt
            dist-di1/SOURCE.txt
          if-no-files-found: error

# D3D9/D3D9Ex smoke tests use a real interactive graphics driver and run locally.
